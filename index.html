<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>DZ Imports | Nueva era, misma pasión</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#050505;
  border-bottom:1px solid #292929;
}

.header{
  max-width:1200px;
  margin:auto;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:6px;
}

.tagline{
  color:#999;
  font-size:11px;
  letter-spacing:4px;
  margin-top:7px;
}

.cart-button{
  background:#fff;
  color:#000;
  border:0;
  border-radius:12px;
  padding:15px 20px;
  font-size:15px;
  font-weight:800;
}

/* HERO */

.hero{
  max-width:1200px;
  margin:25px auto;
  padding:80px 35px;
  border:1px solid #292929;
  border-radius:25px;
  background:
    radial-gradient(
      circle at 75% 30%,
      #252525 0%,
      #111 25%,
      #050505 65%
    );
}

.hero-small{
  color:#999;
  font-size:13px;
  letter-spacing:5px;
  margin-bottom:20px;
}

.hero h1{
  font-size:65px;
  line-height:.95;
  margin-bottom:25px;
}

.hero p{
  color:#aaa;
  font-size:18px;
  line-height:1.5;
  max-width:650px;
  margin-bottom:30px;
}

.hero-button{
  background:#fff;
  color:#000;
  border:0;
  border-radius:10px;
  padding:17px 25px;
  font-size:15px;
  font-weight:900;
}

/* BUSCADOR */

.controls{
  max-width:1200px;
  margin:35px auto 20px;
  padding:0 20px;
}

.search-box{
  width:100%;
  padding:18px;
  background:#111;
  color:#fff;
  border:1px solid #333;
  border-radius:12px;
  font-size:17px;
  outline:none;
}

.search-box::placeholder{
  color:#999;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:15px 0;
}

.category-button{
  flex:none;
  background:#111;
  color:#fff;
  border:1px solid #333;
  border-radius:25px;
  padding:12px 20px;
  font-weight:800;
}

.category-button.active{
  background:#fff;
  color:#000;
}

/* PRODUCTOS */

.products-title{
  max-width:1200px;
  margin:35px auto 20px;
  padding:0 20px;
}

.products-title h2{
  font-size:40px;
}

.products{
  max-width:1200px;
  margin:0 auto 70px;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.product{
  background:#111;
  border:1px solid #292929;
  border-radius:16px;
  overflow:hidden;
}

.product-image{
  width:100%;
  height:320px;
  object-fit:cover;
  display:block;
  background:#0b0b0b;
}

.product-info{
  padding:16px;
}

.product-name{
  font-size:18px;
  font-weight:800;
  margin-bottom:8px;
}

.product-size{
  color:#999;
  font-size:14px;
  margin-bottom:10px;
}

.product-price{
  font-size:22px;
  font-weight:900;
  margin-bottom:15px;
}

.add-button{
  width:100%;
  background:#fff;
  color:#000;
  border:0;
  border-radius:9px;
  padding:14px;
  font-size:14px;
  font-weight:900;
}

.no-products{
  grid-column:1/-1;
  text-align:center;
  color:#777;
  padding:70px 20px;
  font-size:20px;
}

/* FOOTER */

footer{
  border-top:1px solid #292929;
  text-align:center;
  padding:55px 20px;
  color:#777;
}

footer strong{
  color:#fff;
  font-size:25px;
  letter-spacing:5px;
}

/* CARRITO */

.cart-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:5000;
}

.cart-overlay.show{
  display:block;
}

.cart{
  position:absolute;
  right:0;
  top:0;
  width:100%;
  max-width:450px;
  height:100%;
  background:#101010;
  border-left:1px solid #333;
  padding:25px;
  overflow-y:auto;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.cart-header h2{
  font-size:28px;
}

.close-cart{
  background:none;
  border:0;
  color:#fff;
  font-size:35px;
}

.cart-empty{
  text-align:center;
  color:#777;
  padding:70px 10px;
}

.cart-item{
  display:flex;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid #292929;
}

.cart-item-image{
  width:75px;
  height:85px;
  object-fit:cover;
  border-radius:8px;
}

.cart-item-content{
  flex:1;
}

.cart-item-name{
  font-weight:800;
  margin-bottom:5px;
}

.cart-item-price{
  color:#aaa;
  font-size:14px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

.quantity button{
  width:30px;
  height:30px;
  border:0;
  border-radius:6px;
  font-weight:900;
}

.remove-button{
  background:none;
  border:0;
  color:#777;
  margin-top:8px;
  font-size:12px;
}

.cart-bottom{
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid #333;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  font-size:22px;
  font-weight:900;
  margin-bottom:18px;
}

.whatsapp-button{
  width:100%;
  background:#25D366;
  color:#fff;
  border:0;
  border-radius:10px;
  padding:17px;
  font-size:16px;
  font-weight:900;
}

.clear-button{
  width:100%;
  margin-top:10px;
  background:#151515;
  color:#aaa;
  border:1px solid #444;
  border-radius:10px;
  padding:13px;
}

/* CELULAR */

@media(max-width:950px){

  .products{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:700px){

  .header{
    padding:16px;
  }

  .logo{
    font-size:23px;
    letter-spacing:5px;
  }

  .tagline{
    font-size:9px;
    letter-spacing:3px;
  }

  .cart-button{
    padding:12px;
    font-size:13px;
  }

  .hero{
    margin:15px;
    padding:55px 25px;
  }

  .hero h1{
    font-size:45px;
  }

  .hero p{
    font-size:16px;
  }

  .controls{
    padding:0 15px;
  }

  .products-title{
    padding:0 15px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:0 15px;
  }

  .product-image{
    height:220px;
  }

  .product-info{
    padding:12px;
  }

  .product-name{
    font-size:14px;
  }

  .product-price{
    font-size:17px;
  }

  .add-button{
    font-size:12px;
    padding:12px 5px;
  }

}

@media(max-width:420px){

  .hero h1{
    font-size:38px;
  }

  .products{
    gap:8px;
  }

  .product-image{
    height:200px;
  }

}

</style>

</head>

<body>

<!-- HEADER -->

<header>

<div class="header">

<div>

<div class="logo">
DZ IMPORTS
</div>

<div class="tagline">
NUEVA ERA, MISMA PASIÓN
</div>

</div>

<button
class="cart-button"
onclick="openCart()"
>

🛒 Carrito
(<span id="cart-count">0</span>)

</button>

</div>

</header>


<!-- HERO -->

<section class="hero">

<div class="hero-small">
DZ IMPORTS PRESENTA
</div>

<h1>
NUEVA<br>
COLECCIÓN
</h1>

<p>
Remeras, shorts y conjuntos.
Descubrí nuestros productos disponibles.
</p>

<button
class="hero-button"
onclick="document.getElementById('productos').scrollIntoView({behavior:'smooth'})"
>

VER PRODUCTOS →

</button>

</section>


<!-- BUSCADOR -->

<section class="controls">

<input
id="search"
class="search-box"
type="text"
placeholder="¿Qué estás buscando?"
oninput="renderProducts()"
>


<div class="categories">

<button
class="category-button active"
onclick="changeCategory('Todos',this)"
>
TODOS
</button>

<button
class="category-button"
onclick="changeCategory('Remeras',this)"
>
REMERAS
</button>

<button
class="category-button"
onclick="changeCategory('Shorts',this)"
>
SHORTS
</button>

<button
class="category-button"
onclick="changeCategory('Conjuntos',this)"
>
CONJUNTOS
</button>

</div>

</section>


<!-- TITULO -->

<div class="products-title">

<h2>
Productos
</h2>

</div>


<!-- PRODUCTOS -->

<section
class="products"
id="productos"
>
</section>


<!-- FOOTER -->

<footer>

<strong>
DZ IMPORTS
</strong>

<br><br>

Nueva era, misma pasión.

<br><br>

© 2026 DZ Imports

</footer>


<!-- CARRITO -->

<div
class="cart-overlay"
id="cart-overlay"
onclick="closeCartOutside(event)"
>

<div
class="cart"
onclick="event.stopPropagation()"
>

<div class="cart-header">

<h2>
Mi carrito
</h2>

<button
class="close-cart"
onclick="closeCart()"
>
×
</button>

</div>


<div id="cart-items">
</div>


<div class="cart-bottom">

<div class="cart-total">

<span>
Total
</span>

<span id="cart-total">
Gs. 0
</span>

</div>


<button
class="whatsapp-button"
onclick="sendWhatsApp()"
>

📲 PEDIR POR WHATSAPP

</button>


<button
class="clear-button"
onclick="clearCart()"
>

Vaciar carrito

</button>

</div>

</div>

</div>


<script>

/* WHATSAPP */

const WHATSAPP = "595987213496";


/* PRODUCTOS */

const products = [

{
id:1,
name:"Remera Jordan Blanca",
category:"Remeras",
price:130000,
size:"M",
image:"323d6e74-2015-42a7-a4fe-deaf91002141.jpeg"
},

{
id:2,
name:"Short Jordan",
category:"Shorts",
price:120000,
size:"M",
image:"79be57b0-db43-494f-975d-537b2ad2d86e.jpeg"
},

{
id:3,
name:"Short Lacoste Negro",
category:"Shorts",
price:120000,
size:"M",
image:"186b8117-dba7-4c89-a588-36bfc7499f13.jpeg"
},

{
id:4,
name:"Short Lacoste Azul",
category:"Shorts",
price:120000,
size:"M",
image:"eaf4484f-0887-405c-9599-c3a1aa2e2345.jpeg"
},

{
id:5,
name:"Short Armani Negro",
category:"Shorts",
price:120000,
size:"M",
image:"a095bdc2-d678-4d00-b70f-f15235f8f6ed.jpeg"
},

{
id:6,
name:"Short Armani Azul",
category:"Shorts",
price:120000,
size:"M",
image:"db7962cf-fadc-4141-a04a-2000d62c538a.jpeg"
},

{
id:7,
name:"Conjunto Nike Azul",
category:"Conjuntos",
price:150000,
size:"M",
image:"D0132E48-527A-4D80-BF66-68940B69AA3E.png"
}

];


let category = "Todos";

let cart = [];


/* FORMATO DE PRECIO */

function money(number){

return "Gs. " +
number.toLocaleString("es-PY");

}


/* MOSTRAR PRODUCTOS */

function renderProducts(){

const container =
document.getElementById("productos");

const search =
document
.getElementById("search")
.value
.toLowerCase()
.trim();


const filtered =
products.filter(product => {

const categoryMatch =
category === "Todos" ||
product.category === category;

const searchMatch =
product.name
.toLowerCase()
.includes(search);

return categoryMatch && searchMatch;

});


container.innerHTML = "";


if(filtered.length === 0){

container.innerHTML = `

<div class="no-products">

No encontramos productos.

</div>

`;

return;

}


filtered.forEach(product => {

const card =
document.createElement("article");

card.className = "product";


card.innerHTML = `

<img
class="product-image"
src="${product.image}"
alt="${product.name}"
>


<div class="product-info">

<div class="product-name">

${product.name}

</div>


<div class="product-size">

Talle ${product.size}

</div>


<div class="product-price">

${money(product.price)}

</div>


<button
class="add-button"
onclick="addToCart(${product.id})"
>

AGREGAR AL CARRITO

</button>

</div>

`;


container.appendChild(card);

});

}


/* CATEGORIAS */

function changeCategory(
newCategory,
button
){

category = newCategory;


document
.querySelectorAll(".category-button")
.forEach(btn => {

btn.classList.remove("active");

});


button.classList.add("active");


renderProducts();

}


/* AGREGAR AL CARRITO */

function addToCart(id){

const product =
products.find(
product => product.id === id
);


const existing =
cart.find(
item => item.id === id
);


if(existing){

existing.quantity++;

}else{

cart.push({

...product,

quantity:1

});

}


updateCart();

openCart();

}


/* ACTUALIZAR CARRITO */

function updateCart(){

const count =
cart.reduce(
(total,item) =>
total + item.quantity,
0
);


document
.getElementById("cart-count")
.textContent = count;


const container =
document.getElementById("cart-items");


if(cart.length === 0){

container.innerHTML = `

<div class="cart-empty">

Tu carrito está vacío.

</div>

`;

document
.getElementById("cart-total")
.textContent = "Gs. 0";

return;

}


container.innerHTML = "";


cart.forEach(item => {

const div =
document.createElement("div");


div.className =
"cart-item";


div.innerHTML = `

<img
class="cart-item-image"
src="${item.image}"
>


<div class="cart-item-content">

<div class="cart-item-name">

${item.name}

</div>


<div class="cart-item-price">

${money(item.price)}

</div>


<div class="quantity">

<button
onclick="changeQuantity(${item.id},-1)"
>
−
</button>


<span>

${item.quantity}

</span>


<button
onclick="changeQuantity(${item.id},1)"
>
+
</button>

</div>


<button
class="remove-button"
onclick="removeFromCart(${item.id})"
>

Eliminar

</button>

</div>

`;


container.appendChild(div);

});


const total =
cart.reduce(
(sum,item) =>
sum +
item.price *
item.quantity,
0
);


document
.getElementById("cart-total")
.textContent =
money(total);

}


/* CANTIDAD */

function changeQuantity(
id,
amount
){

const item =
cart.find(
item => item.id === id
);


if(!item){

return;

}


item.quantity += amount;


if(item.quantity <= 0){

cart =
cart.filter(
item => item.id !== id
);

}


updateCart();

}


/* ELIMINAR */

function removeFromCart(id){

cart =
cart.filter(
item => item.id !== id
);

updateCart();

}


/* VACIAR */

function clearCart(){

cart = [];

updateCart();

}


/* ABRIR CARRITO */

function openCart(){

document
.getElementById("cart-overlay")
.classList.add("show");

}


/* CERRAR CARRITO */

function closeCart(){

document
.getElementById("cart-overlay")
.classList.remove("show");

}


/* CERRAR AL TOCAR AFUERA */

function closeCartOutside(event){

if(
event.target.id ===
"cart-overlay"
){

closeCart();

}

}


/* WHATSAPP */

function sendWhatsApp(){

if(cart.length === 0){

alert(
"Tu carrito está vacío."
);

return;

}


let message =
"Hola DZ Imports 👋\n\n" +
"Quiero realizar este pedido:\n\n";


cart.forEach(item => {

message +=

"• " +
item.name +
" — Talle " +
item.size +
" — Cantidad: " +
item.quantity +
" — " +
money(
item.price *
item.quantity
) +
"\n";

});


const total =
cart.reduce(
(sum,item) =>
sum +
item.price *
item.quantity,
0
);


message +=
"\nTotal: " +
money(total);


window.location.href =
"https://wa.me/" +
WHATSAPP +
"?text=" +
encodeURIComponent(message);

}


/* INICIAR */

renderProducts();

updateCart();

</script>

</body>

</html>
